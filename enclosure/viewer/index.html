:root[data-theme=&quot;light&quot;] {

* {

html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

h2,
h3,
h4,
h5,
h6,
p {

}

h3,
h4,
h5,

}

b,
strong,

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

.card {

  corner-shape: var(--corner-shape);

.tabular-nums {

    &lt;table class=&quot;table table-sm&quot;&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;th&gt;Main body&lt;/th&gt;&lt;td&gt;107.3 × 61.3 × 31 mm / 4.22 × 2.41 × 1.22 in; excludes stylus tube and cap. Rail is recessed.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Installed pod depth&lt;/th&gt;&lt;td&gt;31 mm case + 0.35 mm gap + 14 mm pod body + 2.4 mm lid = 47.75 mm / 1.88 in. The 3.65 mm mounting shoe extends below the pod body; 3.30 mm of it sits inside the case.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Board reference&lt;/th&gt;&lt;td&gt;101.5 × 55.5 mm / 4.00 × 2.19 in PCB; mounting pitch 94.5 × 47.9 mm / 3.72 × 1.89 in; holes 3.2 mm / 0.126 in&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Screen aperture&lt;/th&gt;&lt;td&gt;78.6 × 51.2 mm / 3.09 × 2.02 in&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Stylus&lt;/th&gt;&lt;td&gt;Owner measurements: length 87.31 mm / 3 7/16 in; handle ≈7.94 mm / 5/16 in; body ≈4.76 mm / 3/16 in&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Stylus holder&lt;/th&gt;&lt;td&gt;Bore 8.8 mm / 0.346 in; tube 98 mm / 3.86 in; quarter-turn cap; tether provision&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Rail&lt;/th&gt;&lt;td&gt;92.3 mm / 3.63 in recessed track; 90.3 mm / 3.56 in cover extends to side entry. Flush rear surface; 0.35 mm / 0.014 in profile allowance. Actual mating clearance varies with seating height; trial fit pending.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Fan&lt;/th&gt;&lt;td&gt;Sunon MF25100V2-1000U-A99 · 25 × 25 × 10 mm / 0.98 × 0.98 × 0.39 in · 5 V · rated 65 mA · 3 CFM · 16 dBA&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Battery&lt;/th&gt;&lt;td&gt;Adafruit 328 · protected 3.7 V / 2500 mAh LiPo · 60 × 50 × 7.3 mm / 2.36 × 1.97 × 0.29 in&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Booster / charger&lt;/th&gt;&lt;td&gt;Adafruit PowerBoost 1000C · approximately 5.2 V output / up to 1 A · 45 × 23 × 10 mm / 1.77 × 0.91 × 0.39 in nominal envelope&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Power route&lt;/th&gt;&lt;td&gt;Battery-only pod → keyed case socket → internal PowerBoost → isolated CYD 5 V feed + fan. Separate USB-C charge-input socket proposed. USB source isolation, CYD solder point and connector retention remain unresolved.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;BAT polarity&lt;/th&gt;&lt;td&gt;Owner-reported: negative toward USB; positive toward microSD. Verify cable polarity before connecting.&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;th&gt;Validation&lt;/th&gt;&lt;td&gt;STL meshes watertight. Board fit, connector heights, fan holes, switch / charge-port placement, charging and thermal performance pending.&lt;/td&gt;&lt;/tr&gt;
